# Render Blueprint. Secrets (sync: false) are typed in the Render dashboard, never committed.
services:
  - type: web
    name: tiis-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: SQLite + in-process lock. Threads give enough concurrency for ~60 learners.
    startCommand: gunicorn "backend.app:create_app()" --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_TOKEN
        sync: false
      - key: TEAM_TOKEN
        generateValue: true
      - key: PROJECT_START
        value: "2026-10-19"
      # Free plan has no persistent disk: this file is wiped on restart/redeploy/spin-down.
      - key: DB_PATH
        value: /tmp/data.db
