# Render Blueprint. Secrets (sync: false) are typed in the Render dashboard, never committed.
services:
  - type: web
    name: tiis-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: SQLite + in-process lock. Threads give enough concurrency for ~60 learners.
    startCommand: gunicorn "backend.app:create_app()" --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_TOKEN
        sync: false
      - key: DATABASE_URL          # Supabase Session pooler URI (contains the DB password): set in the dashboard
        sync: false
      - key: PROJECT_START
        value: "2026-10-19"
      # Used only when DATABASE_URL is empty. The free plan has no persistent disk, so this file is
      # wiped on restart: set DATABASE_URL to keep data.
      - key: DB_PATH
        value: /tmp/data.db
